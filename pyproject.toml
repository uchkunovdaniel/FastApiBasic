[project]
name = "fastapi-basic"
version = "0.1.0"
description = "FastAPI basic application"
requires-python = ">=3.10"
dependencies = [
    "fastapi~=0.156.4",
    "pydantic~=2.14.1",
    "SQLAlchemy~=2.1.5",
    "fastapi[standart]"
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
